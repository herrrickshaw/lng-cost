[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lng-cost"
version = "0.1.0"
description = "Parametric LNG value-chain cost estimator: liquefaction, shipping, regasification, delivered $/MMBtu"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lng-cost = "lng_cost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
