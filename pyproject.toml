[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lng-cost"
version = "0.1.0"
description = "Parametric LNG value-chain cost estimator: liquefaction, shipping, regasification, delivered $/MMBtu"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
lng-cost = "lng_cost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
